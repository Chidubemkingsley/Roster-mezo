[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
evm_version = "london"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = true

[profile.default.fuzz]
runs = 512
max_test_rejects = 65536

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci]
optimizer = true
optimizer_runs = 200

[profile.ci.fuzz]
runs = 5000
max_test_rejects = 100000

[profile.ci.invariant]
runs = 512
depth = 100
fail_on_revert = false
